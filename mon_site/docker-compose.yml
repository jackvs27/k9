version: '3.9'
services:
  web:
    build: .
    ports:
      - '4000:4000'
    environment:
      - PORT=4000
      - DATA_DIR=/data
      - UPLOAD_DIR=/uploads
      - ALLOWED_ORIGINS=http://localhost:4000
    volumes:
      - ./data:/data
      - ./uploads:/uploads
    depends_on:
      - db
      - minio
  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=chat
      - POSTGRES_USER=chat
      - POSTGRES_PASSWORD=chat
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
  minio:
    image: minio/minio
    command: server /data
    environment:
      - MINIO_ROOT_USER=admin
      - MINIO_ROOT_PASSWORD=adminadmin
    ports:
      - '9000:9000'
      - '9090:9090'
    volumes:
      - miniodata:/data
volumes:
  pgdata:
  miniodata:
